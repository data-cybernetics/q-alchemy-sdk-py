name: Package check

# Offline check that the package builds and imports as it would from PyPI.
# No secrets and no calls to the Q-Alchemy API: state preparation and the
# simulator run on PineXQ, so the SDK never needs the simulator engine
# installed. It can't catch anything only the live service would reject.
#
#   build:   sdist + wheel, lints the wheel contents and the PyPI README
#   install: the built wheel with all extras in a clean venv, on the lowest
#            and highest supported Python (requires-python), then imports
#            every q_alchemy module

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.baipp.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
      - id: baipp
        uses: hynek/build-and-inspect-python-package@v3

  install:
    name: Install and import (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the wheel with all extras
        run: |
          uv venv
          uv pip install "$(ls dist/*.whl)[qiskit,pennylane]"
          uv pip check
      # No checkout in this job, so only the installed wheel is importable.
      - name: Import every module
        env:
          MPLBACKEND: Agg
        run: |
          .venv/bin/python - <<'EOF'
          import importlib, pkgutil
          import q_alchemy

          mods = [m.name for m in pkgutil.walk_packages(q_alchemy.__path__, "q_alchemy.")]
          for m in mods:
              importlib.import_module(m)
          print(f"imported {len(mods)} modules from {q_alchemy.__file__}")
          EOF
