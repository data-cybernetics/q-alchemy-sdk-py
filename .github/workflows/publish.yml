name: Publish to PyPI

# Publishes the package to PyPI when a GitHub Release is published.
# Authentication uses PyPI Trusted Publishing (OIDC) — no API token is stored.
#
# One-time PyPI setup (Project -> Settings -> Publishing -> Add a trusted publisher):
#   Owner:            data-cybernetics
#   Repository name:  q-alchemy-sdk-py
#   Workflow name:    publish.yml
#   Environment name: pypi
#
# Cut a release: bump [project].version in pyproject.toml, tag it (e.g. v0.3.0),
# and publish a GitHub Release for that tag. This workflow then builds and uploads.

on:
  release:
    types: [published]
  # Manual trigger for re-runs / dry-runs (still publishes — use with care).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment must match the trusted-publisher config on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/q-alchemy-sdk-py/
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
