
[tool.pdm]
distribution = true

[tool.pdm.build]
includes = [
    "src/q_alchemy",
]

[build-system]
requires = [
    "pdm-backend>=2.5.0",
]
build-backend = "pdm.backend"

[project]
name = "q-alchemy-sdk-py"
version = "0.4.7"
description = ""
authors = [
    { name = "Carsten Blank", email = "blank@data-cybernetics.com" },
]
dependencies = [
    "pydantic>=2.14.1",
    "httpx>=0.28.1,<1.0.0",
    "tenacity>=9.2.1",
    # Use the tested PineXQ 2.x client; preserve protocol/schema warnings.
    "pinexq-client>=2.7.0,<3",
    "numpy>=2.4.6; python_version < '3.12'",
    "numpy>=2.5.4; python_version >= '3.12'",
    "packaging>=26.3",
    "scipy>=1.17.1; python_version < '3.12'",
    "scipy>=1.18.1; python_version >= '3.12'",
    "tqdm>=4.70.1",
    "pyarrow>=26.0.0",
]
requires-python = "<3.15,>=3.11"
readme = "README.md"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
pinexq-client = false # we need this even for transitive dependencies
q-alchemy-visualization = false # first-party releases bypass the global seven-day delay

[tool.uv.extra-build-dependencies]
# Legacy IBM source releases import pkg_resources while generating metadata.
ibm-platform-services = ["setuptools<82"]
ibm-cloud-sdk-core = ["setuptools<82"]

# Keep the examples extra CPU-only. PyPI's Linux PyTorch wheels pull the
# CUDA/NVIDIA runtime stack into uv.lock even when GPU support is not used.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "pytest-dotenv>=0.5.2",
    "notebook>=7.6.3",
    "pip>=26.2.2",
    "scipy-stubs>=1.17.1.5; python_version < '3.12'",
    "scipy-stubs>=1.18.1.1; python_version >= '3.12'",
    "qiskit[qasm3-import]>=2.3.0",
    "qiskit-addon-utils>=0.4.0",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "pennylane>=0.45.1",
    "pennylane-qiskit>=0.45.0",
    "pandas>=3.1.0",
]

[project.optional-dependencies]
visualization = [
    "q-alchemy-visualization>=0.1.0",
]
qiskit = [
    "qiskit[qasm3-import]>=2.3.0",
]
pennylane = [
    "pennylane>=0.45.1",
    "pennylane-qiskit>=0.45.0",
    "openqasm3[parser]>=1.0.1",
]
examples = [
    "qiskit>=2.3.0",
    "pennylane>=0.45.1",
    "pennylane-qiskit>=0.45.0",
    "qutip>=5.3.1",
    "pylatexenc>=2.11",
    "qiskit-experiments>=0.14.2",
    "qiskit-aer>=0.17.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "python-dotenv>=1.2.4",
    "qiskit-ibm-runtime>=0.45.1",
]

[project.license]
text = "Apache"
